[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-tracker"
version = "0.1.0"
description = "Personal budget tracker with SQL storage and a CLI."
requires-python = ">=3.9"
dependencies = ["SQLAlchemy>=2.0", "textual>=0.60", "keyring>=24", "alembic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]

[project.scripts]
budget = "budget_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["budget_tracker*"]

[tool.setuptools.package-data]
# The Mako template `alembic revision --autogenerate` needs; not Python, so it is not
# picked up automatically the way the package's .py files are.
"budget_tracker.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["src/test/test_python"]
# Full runs: `pytest -n auto` (pytest-xdist), about 6x faster. It is deliberately not in
# addopts, because starting the workers adds about 2 s to every run, including a run of
# one small file.
