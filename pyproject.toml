[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-tracker"
version = "0.1.0"
description = "Personal budget tracker with SQL storage and a CLI."
requires-python = ">=3.9"
dependencies = ["SQLAlchemy>=2.0", "textual>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
budget = "budget_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["budget_tracker*"]

[tool.pytest.ini_options]
testpaths = ["src/test/test_python"]
